[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-factory"
version = "0.1.0"
description = "Python-first short-video pipeline: script, scenes, visuals, voiceover, subtitles, FFmpeg render"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
video-factory-py = "video_factory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/video_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
